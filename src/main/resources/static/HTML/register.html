<!DOCTYPE html>
<html lang="en">

  <head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>CineVAULT - Register</title>

    <link
            rel="stylesheet"
            href="/CSS/login.css">

  </head>


  <body>

    <div class="login-container">

      <div class="login-box">

        <!-- TITLE -->

        <h1>CineVAULT</h1>

        <p class="login-subtitle">
          Create your account
        </p>


        <!-- REGISTER FORM -->

        <form id="register-form">


          <!-- NAME -->

          <div class="form-group">

            <label for="name">
              Name
            </label>

            <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required>

          </div>


          <!-- EMAIL -->

          <div class="form-group">

            <label for="email">
              Email
            </label>

            <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>

          </div>


          <!-- PASSWORD -->

          <div class="form-group">

            <label for="password">
              Password
            </label>

            <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>

          </div>


          <!-- CONFIRM PASSWORD -->

          <div class="form-group">

            <label for="confirm-password">
              Confirm Password
            </label>

            <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required>

          </div>


          <!-- MESSAGE -->

          <p id="message"></p>


          <!-- REGISTER BUTTON -->

          <button
                  type="submit"
                  class="login-btn">

            Register

          </button>


        </form>


        <!-- LOGIN LINK -->

        <p class="register-link">

          Already have an account?

          <a href="/login">
            Login
          </a>
        </p>
      </div>
    </div>
    <script src="/JavaScript/register.js"></script>

  </body>

</html>
