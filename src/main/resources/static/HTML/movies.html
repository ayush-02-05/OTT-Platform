<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>CineVAULT - Movies</title>

        <link rel="stylesheet" href="/CSS/sidebar.css">
        <link rel="stylesheet" href="/CSS/movies.css">
        <link rel="stylesheet" href="/CSS/header.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </head>

    <body>

        <div id="sidebar-container"></div>
        <div id="header-container"></div>

        <main class="movies-page">
            <div class="movies-top">
                <div class="movies-heading">
                    <h1>Movies</h1>
                    <p>Discover great stories from every genre.</p>
                </div>
                <div class="movie-filters">
                    <select id="genre-filter"><option value="">All Genres</option></select>
                    <select id="year-filter"><option value="">All Years</option></select>
                    <select id="sort-filter"><option value="">Sort by</option></select>
                </div>
            </div>


            <div class="movie-grid" id="movie-grid"></div>
        </main>

        <script src="/JavaScript/movies.js"></script>
        <script src="/JavaScript/sidebar.js"></script>
        <script src="../JavaScript/header.js"></script>

    </body>
</html>
